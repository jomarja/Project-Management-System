spring.application.name=project-management-system

# ---------- Database (H2 file database, data survives restarts) ----------
spring.datasource.url=jdbc:h2:file:./data/pms-db
spring.datasource.username=sa
spring.datasource.password=
# Create/update tables automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
# Print executed SQL to the console
spring.jpa.show-sql=true
# Load lazy collections (task tags) in batches to avoid the N+1 query problem
spring.jpa.properties.hibernate.default_batch_fetch_size=20
# Touch the database only inside @Transactional service methods
spring.jpa.open-in-view=false

# H2 web console: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/pms-db, user: sa)
spring.h2.console.enabled=true

# ---------- File upload ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Folder where uploaded task attachments are stored
app.upload.dir=uploads

# ---------- Pagination ----------
# Render Page results as a simple JSON object: { "content": [...], "page": {...} }
spring.data.web.pageable.serialization-mode=via-dto
